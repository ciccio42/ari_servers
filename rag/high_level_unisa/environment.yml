# Conda environment of the high_level_unisa RAG (rag_high_level_unisa), created in the image ari_rag_server by
# rag/docker/Dockerfile. Only what the retrieval of DiemRAG uses: LangChain (Chroma, BM25, Ollama for the rewriting
# and the list mode), BGE-M3 and the reranker with sentence-transformers. The generation is done by the LLM server.
# Versions: versione_finale/requisiti.txt of high-level-unisa (pip freeze of 14/10/2026), torch for CUDA 13 (GB10).
name: rag_high_level_unisa
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.12.0
      - transformers==5.12.0
      - sentence-transformers==5.5.0
      - tokenizers==0.22.2
      - safetensors==0.7.0
      - huggingface_hub==1.14.0
      - chromadb==1.5.8
      - langchain==1.3.0
      - langchain-core==1.4.0
      - langchain-community==0.4.1
      - langchain-classic==1.0.4
      - langchain-chroma==1.1.0
      - langchain-huggingface==1.2.2
      - langchain-ollama==1.1.0
      - langchain-text-splitters==1.1.2
      - ollama==0.6.1
      - rank-bm25==0.2.2
      - numpy==2.2.6
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - pydantic==2.13.4
      - pyyaml==6.0.3
