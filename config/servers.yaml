# Servers of the DGX Spark (architecture: ari_demo_arch.png). One section per server, the keys are the fields of its
# config dataclass. Environment (<PREFIX>_<FIELD>) and command line (--<field>) override these values.
# Relative paths are relative to ari_servers (WORKSPACE, /workspace in the containers).

# No concurrent executions: the servers share this lock, one request at a time among all of them (also in different
# containers: they all mount ari_servers). Empty: disabled. Env: ARI_EXECUTION_LOCK
execution_lock: run/execution.lock

# <WHISPER_PORT>: speech to text. Env WHISPER_<FIELD>, e.g. WHISPER_MODEL=openai/whisper-large-v3
whisper:
  port: 8000
  model: openai/whisper-large-v3-turbo
  optimization: O4                 # O1..O4, none
  provider: CUDAExecutionProvider
  language: Italian
  vad_threshold: 0.7

# <LLM_PORT>: answers of the demo (LLM + RAG), for the custom actions of Rasa. Env LLM_<FIELD>
llm:
  port: 8010
  backend: openai                  # openai (ChatGPT), transformers (local: to port), echo (tests)
  model: gpt-4o                    # OpenAI model, or Hugging Face id for transformers
  temperature: 0.3                 # ChatGPT: only gpt-4o / gpt-4o-mini
  timeout: 60                      # seconds for one answer, new attempts included
  system_prompt_file: llm/prompts/ari_system.txt   # default system prompt ({max_char} -> max_char)
  max_char: 250
  history_length: 4                # messages per conversation, the request included
  # RAG of the requests that do not say it: ChatGPT searches the documents of the OpenAI vector store (file_search,
  # section openai); a local backend uses rag_index (not ported yet). The social action of Rasa asks for this default
  rag: false
  rag_index: models/rag/index      # FAISS index (prepare_rag.py of PepperDemo), local backends only
  embedding_model: google/embeddinggemma-300m
  reranker_model: BAAI/bge-reranker-v2-m3
  top_k: 4
  # RAG servers (rag/<name>): a request with "rag": "<name>" asks that server for the context and answers with its
  # system prompt and its model (the generator of section rag_<name>, e.g. Ollama with qwen3.6)
  rag_servers: "department_office=http://localhost:8030, high_level_unisa=http://localhost:8031, department=http://localhost:8032"

# <TTS_PORT>: text to speech (Piper) for the behaviour trees of ARI: POST /synthesize -> WAV. Env TTS_<FIELD>
tts:
  port: 8020
  # <voice name>=<model .onnx (its .onnx.json next to it)>: the requests choose the voice by name, the first is the default
  voices: "Italian=models/piper/it_IT-paola-medium.onnx, English=models/piper/en_GB-cori-medium.onnx"
  use_cuda: true                   # GPU: ~0.1 s for any length; CPU: 0.08 s (short phrase) - 0.3 s (250 characters)
  exclusive: true                  # take the execution lock during the synthesis

# ChatGPT backend of the LLM server (llm.backend: openai). Env OPENAI_<FIELD>. The key: only OPENAI_API_KEY in
# config/secrets.env (not versioned). Commented: the default of the code
openai:
  reasoning_effort: low            # only gpt-5, o1, o3, o4: minimal, low, medium, high
  vector_store_id: vs_6adf80ee4cf481919b35fecdd7d1efd9   # diabetology and cardiology documents (RAG)
  # rag_model: gpt-4o              # model of the RAG answers; default llm.model
  # rag_reasoning_effort: low      # default reasoning_effort
  file_search_max_results: 5       # passages of every search, 1-50
  file_search_tool_choice: required  # required: always search; auto: the model decides
  # file_search_score_threshold: 0.3   # discard passages below this relevance (0-1)
  # file_search_ranker: auto
  # rag_max_output_tokens: 1000
  # rag_temperature: 0.3           # only the non-reasoning models
  # rag_verbosity: low             # gpt-5 only
  max_retries: 1                   # new attempts after a server or connection error

# Ollama (ollama/docker/run.bash): the local models of the RAGs, backend ollama of the LLM server. Env OLLAMA_<FIELD>
ollama:
  url: http://localhost:11500
  num_ctx: 16384                   # context in tokens; a RAG server can give its own
  keep_alive: 2h
  think: false

# RAG servers (rag/<name>, container rag_<name>, image ari_rag_server). They are started by the orchestrator, one at a
# time with its model; `bash run_servers.bash start rag` starts all of these instead (memory: one qwen3.6 each)
rag_servers: [department_office, high_level_unisa, department]

# <RAG_PORT>: DIEM department (RAG of the course Generative AI, local version): courses, people, research, calls,
# Erasmus. Only the retrieval (domain filter, rewriting and router call Ollama); the LLM server generates with
# generator_backend/generator_model. Env RAG_DEPARTMENT_<FIELD>
rag_department:
  port: 8032
  kb_dir: rag_knowledge_base/department          # vectorstore/ (Chroma, 13 collections)
  generator_backend: ollama
  generator_model: qwen3:30b-a3b-instruct-2507-fp16   # Qwen3-30B-A3B-Instruct-2507 of the original, fp16
  temperature: 0.0
  max_new_tokens: 4096
  num_ctx: 16384
  ollama_url: http://localhost:11500
  use_history: true                              # the original used an empty history at every request (test)

# <ORCHESTRATOR_PORT>: loads on request one pair LLM + RAG at a time (POST /load {"llm", "rag"}), unloading the previous
# one: RAG containers and models of Ollama. Env ORCHESTRATOR_<FIELD>
orchestrator:
  port: 8040
  keep_alive: 2h                   # the model loaded stays in memory between the requests
  rag_timeout: 900                 # seconds for a RAG to start (first start: download of its models)
  default_rag: ""                  # pair loaded at the start of the orchestrator, e.g. high_level_unisa
  default_llm: ""

# <RAG_PORT>: resolutions of the Consiglio Didattico di Ingegneria Informatica (rag_unisa, M.S. D'Acunto).
# Only the retrieval: the LLM server generates with generator_backend/generator_model. Env RAG_DEPARTMENT_OFFICE_<FIELD>
rag_department_office:
  port: 8030
  kb_dir: rag_knowledge_base/department_office   # qdrant/, registers.json
  generator_backend: ollama
  generator_model: qwen3.6:35b-a3b-q8_0          # the model of the evaluations of rag_unisa
  temperature: 0.1
  max_new_tokens: 1500             # the attendance lists repeat the citation on every line: 800 cut them
  num_ctx: 16384
  ollama_url: http://localhost:11500             # planner of the registers (questions over many meetings)
  embedding_model: BAAI/bge-m3
  reranker_model: BAAI/bge-reranker-v2-m3
  top_k: 14
  candidates: 40

# <RAG_PORT>: University of Salerno, Ateneo (high-level-unisa, M.S. Grimaldi, optimized by Iannone): people, offices,
# courses, regulations. Only the retrieval (rewriting and list mode call Ollama); the LLM server generates with
# generator_backend/generator_model and sends the answer back for the check of the names. Env RAG_HIGH_LEVEL_UNISA_<FIELD>
rag_high_level_unisa:
  port: 8031
  kb_dir: rag_knowledge_base/high_level_unisa    # diem_vectorstore/, anagrafe.json, registro_strutture.json
  generator_backend: ollama
  generator_model: qwen3.6:35b-a3b               # the model of the evaluations of high-level-unisa
  temperature: 0.0
  max_new_tokens: 4096
  num_ctx: 32768                                 # the longest prompt measured: 17953 tokens
  ollama_url: http://localhost:11500

# <RASA_PORT>: dialogue. The clients reach this proxy on the ports of today, one per bot; it forwards to the bot
# (rasa run --enable-api, internal port) taking the execution lock. Env RASA_<FIELD>
rasa:
  # <client port>=<bot>: social (rasa/bots/social), rock paper scissor, connect four
  routes: "5002=http://localhost:5012, 5003=http://localhost:5013, 5004=http://localhost:5014"
  # false: the social action calls the LLM server, which takes the lock while it generates. With true the proxy would
  # hold the lock during the whole answer and the LLM server would wait for it forever
  exclusive: false
